    <!-- Seamless Preview & WebSocket Handler -->
    <script>
      (function() {
        // 1. Intercept Vite HMR WebSocket in preview iframe where HMR is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          function ViteSilentWebSocket(url, protocols) {
            const isViteHmr = protocols === 'vite-hmr' || 
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) || 
              (typeof url === 'string' && url.includes('vite-hmr'));

            if (isViteHmr) {
              const emitter = new EventTarget();
              emitter.url = url;
              emitter.protocol = 'vite-hmr';
              emitter.readyState = 1; // WebSocket.OPEN
              emitter.bufferedAmount = 0;
              emitter.extensions = '';
              emitter.binaryType = 'blob';
              emitter.send = function() {};
              emitter.close = function() {
                emitter.readyState = 3;
              };
              setTimeout(function() {
                const openEvent = new Event('open');
                emitter.dispatchEvent(openEvent);
                if (typeof emitter.onopen === 'function') emitter.onopen(openEvent);
              }, 0);
              return emitter;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteSilentWebSocket.prototype = NativeWebSocket.prototype;
          ViteSilentWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          ViteSilentWebSocket.OPEN = NativeWebSocket.OPEN;
          ViteSilentWebSocket.CLOSING = NativeWebSocket.CLOSING;
          ViteSilentWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = ViteSilentWebSocket;
        }

        // 2. Filter harmless [vite] WebSocket disconnect logs from console
        const originalConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string') {
            if (args[0].includes('WebSocket closed without opened') || 
                args[0].includes('[vite] Error: WebSocket') ||
                args[0].includes('WebSocket connection to')) {
              return;
            }
          }
          originalConsoleError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (event.message && (event.message.includes('WebSocket') || event.message.includes('[vite]'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
